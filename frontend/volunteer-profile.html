<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Volunteer Profile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-form { display: grid; gap: 16px; max-width: 620px; }
    .profile-form label { display: grid; gap: 6px; font-weight: 600; }
    .profile-form input, .profile-form textarea { width: 100%; box-sizing: border-box; padding: 11px; font: inherit; border: 1px solid #9ca3af; border-radius: 6px; }
    .profile-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #profileMessage { min-height: 1.5em; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Volunteer Profile</div>
    <div class="nav-links"><a href="volunteer-dashboard.html">Dashboard</a><a href="#" onclick="logout(); return false;">Logout</a></div>
  </nav>
  <main class="container">
    <h1>Edit Volunteer Profile</h1>
    <div class="card">
      <form id="editProfileForm" data-role="volunteer" class="profile-form" onsubmit="saveEditableProfile(event)">
        
        <label>First Name <input type="text" name="first_name" maxlength="100" required></label>
        <label>Last Name <input type="text" name="last_name" maxlength="100" required></label>
        <label>Phone <input type="tel" name="phone" maxlength="50"></label>
        <label>Location <input type="text" name="location" maxlength="255"></label>
        <label>Availability <textarea name="availability_summary" rows="3" maxlength="1000"></textarea></label>
        <div class="profile-actions">
          <button class="btn" type="submit">Save Changes</button>
          <a class="btn" href="volunteer-dashboard.html">Cancel</a>
        </div>
      </form>
      <p id="profileMessage" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
