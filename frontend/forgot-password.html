<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Forgot Password | VolunteerConnect</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .recovery-card { max-width: 540px; margin: 40px auto; }
    .recovery-card label { display: block; margin: 18px 0 7px; font-weight: 600; }
    .recovery-card input { width: 100%; box-sizing: border-box; padding: 12px; font: inherit; }
    .recovery-card .btn { margin-top: 20px; }
    .recovery-card [role="status"] { min-height: 1.5em; margin-top: 15px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">VolunteerConnect</div>
    <div class="nav-links"><a href="index.html">Home / Login</a><a href="opportunities.html">Opportunities</a></div>
  </nav>
  <main class="container">
    <div class="card recovery-card">
      <h1>Forgot Password?</h1>
      <p>Enter the email address you registered with. If there is an active account, we'll send a password-reset link that works for 30 minutes.</p>
      <form id="forgotPasswordForm">
        <label for="recoveryEmail">Email address</label>
        <input id="recoveryEmail" type="email" autocomplete="email" maxlength="254" required placeholder="name@example.com">
        <button id="requestButton" class="btn" type="submit">Send Reset Link</button>
      </form>
      <p id="recoveryMessage" role="status" aria-live="polite"></p>
      <p><a href="index.html">Back to Login</a></p>
    </div>
  </main>
  <footer>Community Volunteer Coordination Platform</footer>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('requestButton');
      const message = document.getElementById('recoveryMessage');
      button.disabled = true;
      message.textContent = 'Submitting request...';
      try {
        const response = await fetch('http://localhost:5000/api/auth/forgot-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email: document.getElementById('recoveryEmail').value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed. Please try again.');
        message.textContent = data.message;
        document.getElementById('forgotPasswordForm').reset();
      } catch (error) {
        message.textContent = error.message === 'Failed to fetch'
          ? 'Could not connect to the backend. Check that node server.js is running.'
          : error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
