<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Volunteer System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <div class="auth-card">
            <h1>Volunteer System</h1>
            <p>Community Volunteer Coordination Platform</p>
            <form id="loginForm">
                <div class="field">
                    <label>Email</label>
                    <input type="email" required placeholder="Enter your email">
                </div>
            <div class="field">
                <label>Password</label>
                <input type="password" required placeholder="Enter your password">
            </div>
            <div class="field">
                <label>Login as</label>
                <select id="role">
                    <option value="volunteer">Volunteer</option>
                    <option value="admin">Organisation Admin</option>
                </select>
            </div>
            <div class="actions">
                <button class="btn" type="submit">Log In</button>
            </div>
        </form>
        <div class="auth-links">New user? <a href="register.html">
            <b>Create an account</b></a>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
