<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Register
</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        VolunteerConnect
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="opportunities.html">
            Opportunities
        </a>

    </div>

</nav>


<div class="container">

    <div class="card">

        <h1 class="page-title">
            Create Account
        </h1>

        <div
            id="message"
            class="message"
        ></div>

        <form
            onsubmit="registerUser(event)"
        >

            <div>

                <label>
                    Account Type
                </label>

                <select
                    id="registerRole"
                    onchange="toggleRegistrationFields()"
                >

                    <option value="volunteer">
                        Volunteer
                    </option>

                    <option value="organisation_admin">
                        Organisation
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Email
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    required
                >

            </div>


            <div>

                <label>
                    Password
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    minlength="6"
                    required
                >

            </div>


            <div
                id="volunteerFields"
                class="grid grid-2"
            >

                <div>

                    <label>
                        First Name
                    </label>

                    <input
                        id="firstName"
                    >

                </div>


                <div>

                    <label>
                        Last Name
                    </label>

                    <input
                        id="lastName"
                    >

                </div>

            </div>


            <div>

                <label>
                    Phone
                </label>

                <input id="phone">

            </div>


            <div>

                <label>
                    Location
                </label>

                <input id="location">

            </div>


            <div
                id="organisationFields"
                style="display:none"
            >

                <label>
                    Organisation Name
                </label>

                <input
                    id="organisationName"
                >

            </div>


            <button class="btn success">

                Create Account

            </button>

        </form>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
