<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Post Opportunity
</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Create Opportunity
    </div>

    <div class="nav-links">

        <a href="admin-dashboard.html">
            Dashboard
        </a>

        <a href="admin-opportunities.html">
            Opportunities
        </a>

    </div>

</nav>


<div class="container">

    <div class="card">

        <h1>
            Post Volunteer Opportunity
        </h1>

        <form
            onsubmit="createOpportunity(event)"
        >

            <div>

                <label>
                    Opportunity Title
                </label>

                <input
                    id="title"
                    required
                >

            </div>


            <div>

                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    required
                ></textarea>

            </div>


            <div>

                <label>
                    Location
                </label>

                <input
                    id="opportunityLocation"
                    required
                >

            </div>


            <div class="grid grid-2">

                <div>

                    <label>
                        Start Date and Time
                    </label>

                    <input
                        id="startDate"
                        type="datetime-local"
                        required
                    >

                </div>


                <div>

                    <label>
                        End Date and Time
                    </label>

                    <input
                        id="endDate"
                        type="datetime-local"
                        required
                    >

                </div>

            </div>


            <div>

                <label>
                    Required Volunteers
                </label>

                <input
                    id="requiredVolunteers"
                    type="number"
                    min="1"
                    required
                >

            </div>


            <button
                class="btn success"
            >
                Publish Opportunity
            </button>

        </form>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
