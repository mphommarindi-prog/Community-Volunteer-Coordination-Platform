<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Post Opportunity - Volunteer System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">Volunteer System</div>
            <nav class="nav">
                <a href="admin-dashboard.html" class="">Dashboard</a>
                <a href="admin-opportunities.html" class="">Manage Opportunities</a>
                <a href="post-opportunity.html" class="active">Post Opportunity</a>
                <a href="admin-applicants.html" class="">Applicants</a>
                <a href="admin-profile.html" class="">Profile</a>
            </nav>
            <a class="logout" href="index.html">Log Out</a>
        </aside>
<main class="main">
    <div class="container">
        <div class="page-head">
            <div>
                <h1>Post Opportunity</h1>
                <p>Create a new volunteering opportunity.</p>
            </div>
        </div>
        <form class="form-card" id="signupForm">
            <div class="form-grid">
            <div class="field full">
                <label>Title</label>
                <input required placeholder="e.g. Road Cleanup">
            </div>
            <div class="field">
                <label>Category</label>
                <select>
                    <option>Environment</option>
                    <option>Community</option>
                    <option>Charity</option>
                    <option>Education</option>
                </select>\
            </div>
            <div class="field">
                <label>Number of spots</label>
                <input type="number" min="1" required>
            </div>
            <div class="field full">
                <label>Location</label>
                <input required>
            </div>
            <div class="field">
                <label>Date</label>
                <input type="date" required>
            </div>
            <div class="field">
                <label>Time</label>
                <input type="time" required>
            </div>
            <div class="field full">
                <label>Description</label>
                <textarea required placeholder="Describe the opportunity..."></textarea>
            </div>
        </div>
        <div class="actions">
            <a class="btn secondary" href="admin-opportunities.html">Cancel</a>
            <button class="btn" type="submit">Add</button>
        </div>
    </form>
</div>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
