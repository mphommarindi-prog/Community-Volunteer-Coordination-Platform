<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Volunteer Dashboard
</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Volunteer Dashboard
    </div>

    <div class="nav-links">

        <a href="opportunities.html">
            Opportunities
        </a>

        <a href="my-opportunities.html">
            My Applications
        </a>

        <a
            href="#"
            onclick="logout()"
        >
            Logout
        </a>

    </div>

</nav>


<div class="container">

    <h1>
        Welcome Back
    </h1>

    <div class="grid grid-3">

        <div class="card">

            <h3>
                Browse Opportunities
            </h3>

            <p>
                Find new ways to support
                your community.
            </p>

            <a
                class="btn"
                href="opportunities.html"
            >
                Browse
            </a>

        </div>


        <div class="card">

            <h3>
                My Applications
            </h3>

            <p>
                View the progress of your
                submitted applications.
            </p>

            <a
                class="btn"
                href="my-opportunities.html"
            >
                View
            </a>

        </div>


        <div class="card">

            <h3>
                Volunteer Assistant
            </h3>

            <p>
                Use the chatbot in the
                bottom-right corner if
                you need help.
            </p>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
