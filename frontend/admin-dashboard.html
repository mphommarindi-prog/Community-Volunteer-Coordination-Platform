<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Organisation Dashboard
</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Organisation Dashboard
    </div>

    <div class="nav-links">

        <a href="admin-opportunities.html">
            Opportunities
        </a>

        <a href="admin-applicants.html">
            Applicants
        </a>

        <a href="post-opportunity.html">
            Post Opportunity
        </a>

        <a href="admin-profile.html">
            Profile
        </a>

        <a
            href="#"
            onclick="logout()"
        >
            Logout
        </a>

    </div>

</nav>


<div class="container">

    <h1>
        Dashboard Overview
    </h1>


    <div class="grid grid-3">

        <div class="card">

            <p>
                Opportunities
            </p>

            <div
                class="stat"
                id="totalOpportunities"
            >
                0
            </div>

        </div>


        <div class="card">

            <p>
                Applications
            </p>

            <div
                class="stat"
                id="totalApplications"
            >
                0
            </div>

        </div>


        <div class="card">

            <p>
                Accepted Volunteers
            </p>

            <div
                class="stat"
                id="totalAccepted"
            >
                0
            </div>

        </div>

    </div>

    <div class="card" style="margin-top: 20px;">
        <h3>Organisation Profile</h3>
        <p>Update your organisation's name, phone number and address.</p>
        <a class="btn" href="admin-profile.html">Edit Profile</a>
    </div>

</div>


<script src="app.js"></script>

</body>
</html>
