<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password | VolunteerConnect</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .recovery-card { max-width: 540px; margin: 40px auto; }
    .recovery-card label { display: block; margin: 16px 0 7px; font-weight: 600; }
    .recovery-card input { width: 100%; box-sizing: border-box; padding: 12px; font: inherit; }
    .recovery-card .btn { margin-top: 20px; }
    .recovery-card [role="status"] { min-height: 1.5em; margin-top: 15px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">VolunteerConnect</div>
    <div class="nav-links"><a href="index.html">Home / Login</a></div>
  </nav>
  <main class="container">
    <div class="card recovery-card">
      <h1>Choose a New Password</h1>
      <p>Your reset link is valid for 30 minutes and can only be used once. Use a password with at least 12 characters.</p>
      <form id="resetPasswordForm">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" minlength="12" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
        <button id="resetButton" class="btn" type="submit">Save New Password</button>
      </form>
      <p id="resetMessage" role="status" aria-live="polite"></p>
      <p><a href="index.html">Back to Login</a></p>
    </div>
  </main>
  <footer>Community Volunteer Coordination Platform</footer>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    // Remove token from browser history as soon as the page loads.
    window.history.replaceState(null, '', window.location.pathname);
    if (!token || !/^[a-f0-9]{64}$/.test(token)) {
      document.getElementById('resetMessage').textContent =
        'This reset link is missing or invalid. Please request a new one.';
      document.getElementById('resetPasswordForm').hidden = true;
    }

    document.getElementById('resetPasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('resetMessage');
      const button = document.getElementById('resetButton');
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      if (new TextEncoder().encode(password).length > 72) {
        message.textContent = 'Choose a password shorter than 73 bytes.';
        return;
      }
      button.disabled = true;
      message.textContent = 'Updating password...';
      try {
        const response = await fetch('http://localhost:5000/api/auth/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ token, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Password reset failed.');
        message.textContent = data.message + ' Return to Login to sign in.';
        document.getElementById('resetPasswordForm').reset();
        document.getElementById('resetPasswordForm').hidden = true;
      } catch (error) {
        message.textContent = error.message === 'Failed to fetch'
          ? 'Could not connect to the backend. Check that node server.js is running.'
          : error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
